<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
</head>
<body>
    <header class="store-header">
        <div class="header-container">
            <div class="logo">
                <span class="logo__icon">🍕</span>
                <h1 class="logo__text">Food<span class="logo__span">Store</span></h1>
            </div>

            <nav class="nav">
                <a href="../home/home.html" class="nav__link">
                    <i class="nav-link__icon">🏠</i> Catálogo
                </a>
                <a href="../cart/cart.html" class="nav__link">
                    <i class="nav-link__icon">🛒</i> Carrito
                    <span id="cart-count" class="nav-link__span">0</span>
                </a>
                <button id="logout-btn" class="nav__btn" href="/src/pages/auth/login/login.html">Salir</button>
            </nav>
        </div>
    </header>

    <main class="detail-container">
        <section class="product-detail">
        <div class="product-detail__media">
            <img id="detailImage" class="product-detail__image" src="" alt="">
        </div>
        <div class="product-detail__info">
            <h2 id="detailTitle" class="product-detail__title"></h2>
            <p id="detailDescription" class="product-detail__description"></p>
            <span id="detailBadge" class="product-detail__badge">Disponible (Stock: 30)</span>
            <p id="detailPrice" class="product-detail__price"></p>

            <div class="product-detail__quantity--wrapper">
                <span class="product-detail__quantity-label">Cantidad: </span>
                <div class="quantity-controls">
                    <button id="decreaseBtn" class="quantity-controls__btn">-</button>
                    <span id="quantityValue" class="quantity-controls__value">1</span>
                    <button id="increaseBtn" class="quantity-controls__btn">+</button>
                </div>
            </div>

            <div class="product-detail__actions">
                <button id="addToCartBtn" class="product-detail__add-btn">🛒 Agregar al Carrito</button>
                <button id="backButton" class="product-detail__back-btn">← Volver</button>
            </div>
        </div>
    </section>
    </main>
    
</body>
    <script type="module" src="/src/pages/store/productDetail/productDetail.ts"></script>
</html>
